# =============================================================================
# Find Top Examples — Fine-tuned PLAID v3b (v2: using v3 SAEs on test split)
# =============================================================================
# Finds top-activating examples for each SAE feature across 6 layers.
# Uses the v3 SAE best-val-MSE checkpoints (layer_XX_best-v1.ckpt, expansion=8, dict=16384).
#
# Split policy: test split (val was used for SAE early stopping).
#
# Submit all layers as job array via exca:
#   uv run python main.py find-top-examples \
#       configs/find_top_examples_plaid_finetuned_v3b.yaml \
#       --submit --infra.cluster=slurm

# -- Input --------------------------------------------------------------------
sae_checkpoint_path: "./experiments/sae_checkpoints/plaid_finetuned_v3b/layer_00_best-v1.ckpt"
activation_dir: "./experiments/activations/plaid_finetuned_v3b/xsum/test"
layer_idx: 0

# -- Dataset ------------------------------------------------------------------
dataset_name: "xsum"
dataset_split: "test"

# -- Top-K selection ----------------------------------------------------------
top_k: 30
unique_examples: true

# -- Filtering ----------------------------------------------------------------
features: null
timesteps: null

# -- Output -------------------------------------------------------------------
output_dir: "./experiments/top_examples/plaid_finetuned_v3b_v3"

# -- Hardware -----------------------------------------------------------------
device: "cuda:0"
batch_size: 4096

# -- Exca infra ---------------------------------------------------------------
infra:
  version: "2"
  folder: "./experiments/cache/plaid_finetuned_v3b_top_examples"
  cluster: null
  gpus_per_node: 1
  cpus_per_task: 4
  mem_gb: 64
  timeout_min: 120
  slurm_partition: plgrid-gpu-a100
